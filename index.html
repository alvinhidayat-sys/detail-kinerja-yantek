<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Kinerja Petugas Yantek</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#162033;--accent:#3b82f6;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 24px;background:var(--card2);border-bottom:1px solid var(--border)}
h1{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.wrap{padding:16px 24px;max-width:1400px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;min-width:170px}
label{font-size:11px;color:var(--muted)}
select,input,button{background:#0f172a;border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:6px;font-size:13px}
button{background:var(--accent);border:none;cursor:pointer;font-weight:600}
button.secondary{background:#334155}
button:hover{opacity:.9}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.card .v{font-size:22px;font-weight:700}
.card .l{font-size:11px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;background:var(--card2);color:var(--muted);font-size:13px}
.tab.active{background:var(--card);color:var(--text);font-weight:600}
.tablewrap{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:0 8px 8px 8px}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
th{position:sticky;top:0;background:var(--card2);z-index:1}
tr:hover{background:#25324a}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px;flex-wrap:wrap}
.status{color:var(--muted);font-size:12px}
.err{color:var(--bad)}
.pg{display:flex;gap:6px;align-items:center}
.hide{display:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
</style>
</head>
<body>
<header>
<h1>Detail Kinerja Petugas Yantek</h1>
</header>
<div class="wrap">
  <div class="panel">
    <div class="filters">
      <div class="f"><label>UP3</label><select id="fUP3"><option value="">Semua UP3</option></select></div>
      <div class="f"><label>ULP</label><select id="fULP"><option value="">Semua ULP</option></select></div>
      <div class="f"><label>Nama Petugas</label><select id="fPet"><option value="">Semua Petugas</option></select></div>
      <div class="f"><label>Tanggal Awal</label><input type="date" id="fStart"></div>
      <div class="f"><label>Tanggal Akhir</label><input type="date" id="fEnd"></div>
      <div class="f"><button id="btnApply">Terapkan Filter</button></div>
      <div class="f"><button id="btnReload" class="secondary">Sinkronkan Sekarang</button></div>
    </div>
    <div class="status" id="status">Memuat data dari Google Sheets...</div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="tabs">
    <div class="tab active" data-t="wo">Daftar WO</div>
    <div class="tab" data-t="p0">Daftar P0 (Penugasan Khusus)</div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Cari no laporan / nama petugas..." style="min-width:260px">
      <div class="pg">
        <button class="secondary" id="prevPg">‹ Prev</button>
        <span class="status" id="pgInfo"></span>
        <button class="secondary" id="nextPg">Next ›</button>
      </div>
    </div>
    <div class="tablewrap"><table><thead><tr id="thWO"></tr></thead><tbody id="tbWO"></tbody></table></div>
    <div class="tablewrap hide" id="wrapP0"><table><thead><tr id="thP0"></tr></thead><tbody id="tbP0"></tbody></table></div>
  </div>
</div>

<script>
const SS_ID='1RTPWaXQDqz_bYK67Mwc-flXNK_wMtLQKS18Gf1oL-Pg';
const SHEETS=['CICO WO','CICO P0','detail WO','detail P0','SLA WO','SLA P0','koef unit'];
const D={}; const IDX={};
let woRows=[], p0Rows=[], curTab='wo', page=0, perPage=100, filtersApplied=false;

function csvUrl(name){return `https://docs.google.com/spreadsheets/d/${SS_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;}

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c=='"')q=true;else if(c==','){row.push(f);f='';}else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!='\r')f+=c;}
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
function toObjs(rows){
  const h=rows[0]||[];
  return rows.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]??'').trim());return o;});
}
function num(v){
  if(v==null)return 0; v=String(v).trim(); if(v==='')return 0;
  if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.');
  else if(v.includes(','))v=v.replace(',','.');
  const n=parseFloat(v); return isNaN(n)?0:n;
}
function parseDate(v){
  if(!v)return null; v=String(v).trim(); if(!v)return null;
  let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const n=Number(v);
  if(v!==''&&!isNaN(n)&&n>1000)return new Date(Date.UTC(1899,11,30)+n*86400000);
  return null;
}
function dkey(d){return d?d.toISOString().slice(0,10):null;}
function stripPosko(s){return (s||'').replace(/^POSKO\s*/i,'').trim();}
function fmt(n){return typeof n==='number'?(Math.round(n*100)/100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}):n||'';}

async function fetchSheet(name){
  const res=await fetch(csvUrl(name));
  if(!res.ok)throw new Error('Gagal ambil sheet "'+name+'" (pastikan share: Anyone with link - Viewer)');
  return toObjs(parseCSV(await res.text()));
}

async function loadAll(){
  document.getElementById('status').textContent='Memuat data dari Google Sheets...';
  document.getElementById('status').classList.remove('err');
  try{
    const [cicoWO,cicoP0,detWO,detP0,slaWO,slaP0,koefU]=await Promise.all(SHEETS.map(fetchSheet));
    Object.assign(D,{cicoWO,cicoP0,detWO,detP0,slaWO,slaP0,koefU});
    buildIndices();
    compute();
    buildFilterOptions();
    filtersApplied=false;
    showEmptyState();
    document.getElementById('status').textContent='Data siap ('+cicoWO.length+' WO, '+cicoP0.length+' P0). Pilih filter lalu klik "Terapkan Filter". Terakhir sinkron '+new Date().toLocaleTimeString('id-ID');
  }catch(e){
    document.getElementById('status').textContent='Error: '+e.message;
    document.getElementById('status').classList.add('err');
  }
}

function buildIndices(){
  IDX.detWO=new Map(D.detWO.map(r=>[r.NO_LAPORAN,r]));
  IDX.detP0=new Map(D.detP0.map(r=>[r.NO_PENUGASAN_KHUSUS,r]));
  IDX.slaWO=new Map(D.slaWO.map(r=>[[r['Fasilitas Id'],r['Subfasilitas Id'],r['Equipment Id']].join('|'),r]));
  IDX.slaP0=new Map(D.slaP0.map(r=>[r['Jenis Pekerjaan'],r]));
  IDX.koefU=new Map(D.koefU.map(r=>[r['Nama Up3'],num(r['Koefisien Unit'])]));
}

function compute(){
  woRows=D.cicoWO.map(r=>{
    const noLap=r['No Laporan'];
    const det=IDX.detWO.get(noLap);
    const tgl=parseDate(r['Tgl Pengerjaan'])||parseDate(r['Tgl Lapor']);
    const up3=r['UP3'], ulp=stripPosko(r['Posko']);
    const base={noLap, petugas:r['Nama Petugas'], up3, ulp, tgl};
    if(!det)return {...base, valid:false};
    const key=[det.ID_FASILITAS,det.ID_SUB_FASILITAS,det.ID_EQUIPMENT].join('|');
    const sla=IDX.slaWO.get(key);
    const a=sla?num(sla.SLA):0, d=sla?num(sla.Koefisien):0;
    const b=num(det.DISPATCH_TIME), c=num(det.TRAVEL_TIME), fix=num(det.FIXING_TIME), e=num(det.RCT);
    const f=e-(b+c); const g=f>0?Math.min(a/f,1.5):0;
    const rating=num(det.RATING); const h=rating===5?1.1:1;
    const i=IDX.koefU.get(det.NAMA_UP3)||0; const m=d*g*h*i;
    return {...base, area:det.NAMA_UP3, rayon:stripPosko(det.NAMA_POSKO), a,b,c,fix,d,e,f,g,rating,h,i,m, valid:true};
  });
  p0Rows=D.cicoP0.map(r=>{
    const noTgs=r['No Tugas'];
    const det=IDX.detP0.get(noTgs);
    const tgl=parseDate(r['Tgl Pengerjaan'])||parseDate(r['Tgl Catat']);
    const up3=r['UP3'], ulp=stripPosko(r['Posko']);
    const base={noTgs, petugas:r['Personil Yantek'], up3, ulp, tgl};
    if(!det)return {...base, valid:false};
    const sla=IDX.slaP0.get(det.JENIS_PENUGASAN);
    const a=sla?num(sla.RCT):0, d=sla?num(sla.Koefisien):0;
    const b=num(det.DISPATCH_TIME), c=num(det.TRAVEL_TIME), e=num(det.DURASI_PENUGASAN_KHUSUS);
    const f=e-(b+c); const g=f>0?Math.min(a/f,1.5):0;
    const h=IDX.koefU.get(det.AREA_PTGS)||0; const i=d*g*h;
    return {...base, area:det.AREA_PTGS, rayon:det.RAYON_PTGS, a,b,c,d,e,f,g,h,i, valid:true};
  });
}

function buildFilterOptions(){
  const up3Sel=document.getElementById('fUP3').value;
  const up3s=new Set();
  [...D.cicoWO,...D.cicoP0].forEach(r=>{if(r.UP3)up3s.add(r.UP3);});
  fillSelect('fUP3',[...up3s].sort());

  const ulps=new Set();
  [...D.cicoWO,...D.cicoP0].forEach(r=>{
    if(up3Sel&&r.UP3!==up3Sel)return;
    if(r.Posko)ulps.add(stripPosko(r.Posko));
  });
  fillSelect('fULP',[...ulps].sort());
  const ulpSel=document.getElementById('fULP').value;

  const pets=new Set();
  D.cicoWO.forEach(r=>{
    if(up3Sel&&r.UP3!==up3Sel)return;
    if(ulpSel&&stripPosko(r.Posko)!==ulpSel)return;
    if(r['Nama Petugas'])pets.add(r['Nama Petugas']);
  });
  D.cicoP0.forEach(r=>{
    if(up3Sel&&r.UP3!==up3Sel)return;
    if(ulpSel&&stripPosko(r.Posko)!==ulpSel)return;
    if(r['Personil Yantek'])pets.add(r['Personil Yantek']);
  });
  fillSelect('fPet',[...pets].sort());
}
function fillSelect(id,arr){
  const sel=document.getElementById(id); const cur=sel.value;
  const label=id==='fUP3'?'Semua UP3':id==='fULP'?'Semua ULP':'Semua Petugas';
  sel.innerHTML=`<option value="">${label}</option>`+arr.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">${v}</option>`).join('');
  if(arr.includes(cur))sel.value=cur;
}

function currentFilters(){
  return {
    up3:document.getElementById('fUP3').value,
    ulp:document.getElementById('fULP').value,
    pet:document.getElementById('fPet').value,
    start:document.getElementById('fStart').value?new Date(document.getElementById('fStart').value):null,
    end:document.getElementById('fEnd').value?new Date(document.getElementById('fEnd').value):null,
    q:document.getElementById('search').value.trim().toLowerCase()
  };
}
function matchRow(r,ff){
  if(ff.up3&&r.up3!==ff.up3)return false;
  if(ff.ulp&&r.ulp!==ff.ulp)return false;
  if(ff.pet&&r.petugas!==ff.pet)return false;
  if(ff.start&&(!r.tgl||r.tgl<ff.start))return false;
  if(ff.end&&(!r.tgl||r.tgl>ff.end))return false;
  if(ff.q){const s=((r.noLap||r.noTgs||'')+' '+(r.petugas||'')).toLowerCase(); if(!s.includes(ff.q))return false;}
  return true;
}

let fWO=[], fP0=[];
function showEmptyState(){
  document.getElementById('cards').innerHTML='';
  const msg='<tr><td colspan="20">Silakan pilih filter lalu klik "Terapkan Filter" untuk menampilkan data.</td></tr>';
  document.getElementById('thWO').innerHTML='';
  document.getElementById('thP0').innerHTML='';
  document.getElementById('tbWO').innerHTML=msg;
  document.getElementById('tbP0').innerHTML=msg;
  document.getElementById('pgInfo').textContent='';
}
function applyFilters(){
  filtersApplied=true;
  const ff=currentFilters();
  fWO=woRows.filter(r=>matchRow(r,ff));
  fP0=p0Rows.filter(r=>matchRow(r,ff));
  page=0;
  renderCards(ff);
  renderTable();
}

function renderCards(ff){
  const totalWO=fWO.filter(r=>r.valid).reduce((s,r)=>s+r.m,0);
  const totalP0=fP0.filter(r=>r.valid).reduce((s,r)=>s+r.i,0);
  const rctMin=fWO.filter(r=>r.valid).reduce((s,r)=>s+r.e,0)+fP0.filter(r=>r.valid).reduce((s,r)=>s+r.e,0);
  const rctJam=rctMin/60;
  const hariSet=new Set();
  [...fWO,...fP0].forEach(r=>{if(r.tgl)hariSet.add(dkey(r.tgl));});
  const hari=hariSet.size;
  const rataJam=hari>0?rctJam/hari:0;
  const cards=[
    ['Jumlah WO', fWO.length],
    ['Jumlah P0', fP0.length],
    ['Total Performa WO', fmt(totalWO)],
    ['Total Performa P0', fmt(totalP0)],
    ['Total RCT (jam)', fmt(rctJam)],
    ['Hari Kerja Aktif', hari],
    ['Rata-rata Jam Kerja/Hari', fmt(rataJam)]
  ];
  document.getElementById('cards').innerHTML=cards.map(([l,v])=>`<div class="card"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

const woCols=[['No Laporan','noLap'],['ID Petugas','petugas'],['UP3','up3'],['ULP','ulp'],['Area','area'],['Rayon','rayon'],['SLA(a)','a'],['Dispatch(b)','b'],['Travel(c)','c'],['Fixing','fix'],['Koef WO(d)','d'],['RCT(e)','e'],['Durasi(f)','f'],['Perf Tugas(g)','g'],['Rating','rating'],['Koef Rating(h)','h'],['Koef Unit(i)','i'],['Performance WO(m)','m']];
const p0Cols=[['No Penugasan','noTgs'],['ID Petugas','petugas'],['UP3','up3'],['ULP','ulp'],['Area','area'],['Rayon','rayon'],['SLA(a)','a'],['Dispatch(b)','b'],['Travel(c)','c'],['Koef P0(d)','d'],['RCT(e)','e'],['Durasi(f)','f'],['Perf Tugas(g)','g'],['Koef Unit(h)','h'],['Performance P0(i)','i']];

function renderTable(){
  const cols=curTab==='wo'?woCols:p0Cols;
  const rows=curTab==='wo'?fWO:fP0;
  const th=document.getElementById(curTab==='wo'?'thWO':'thP0');
  th.innerHTML=cols.map(c=>`<th>${c[0]}</th>`).join('');
  const start=page*perPage, slice=rows.slice(start,start+perPage);
  const tb=document.getElementById(curTab==='wo'?'tbWO':'tbP0');
  tb.innerHTML=slice.map(r=>'<tr>'+cols.map(c=>{
    let v=r[c[1]];
    if(c[1]==='tgl'&&v)v=v.toLocaleDateString('id-ID');
    if(typeof v==='number')v=fmt(v);
    return `<td>${v ?? ''}</td>`;
  }).join('')+'</tr>').join('') || '<tr><td colspan="'+cols.length+'">Tidak ada data</td></tr>';
  document.getElementById('pgInfo').textContent=`${rows.length?start+1:0}-${Math.min(start+perPage,rows.length)} dari ${rows.length}`;
  document.getElementById('wrapP0').classList.toggle('hide',curTab!=='p0');
  document.getElementById('tbWO').parentElement.parentElement.classList.toggle('hide',curTab!=='wo');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); curTab=t.dataset.t; page=0; renderTable();
}));
document.getElementById('btnApply').addEventListener('click',applyFilters);
document.getElementById('btnReload').addEventListener('click',loadAll);
document.getElementById('search').addEventListener('input',()=>{if(filtersApplied)applyFilters();});
document.getElementById('fUP3').addEventListener('change',()=>{buildFilterOptions();});
document.getElementById('fULP').addEventListener('change',()=>{buildFilterOptions();});
document.getElementById('prevPg').addEventListener('click',()=>{if(page>0){page--;renderTable();}});
document.getElementById('nextPg').addEventListener('click',()=>{const rows=curTab==='wo'?fWO:fP0; if((page+1)*perPage<rows.length){page++;renderTable();}});

loadAll();
</script>
</body>
</html>
